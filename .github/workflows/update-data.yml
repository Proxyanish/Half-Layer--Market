# Rebuilds every dashboard hourly on weekdays (07:47 to 23:47 UTC) and publishes the data.
# Publishes the dashboards as a website (GitHub Pages, branch "data") and the data files that the Refresh button of any dashboard downloads.
# Developed by Anish Luitel
name: Update market data

on:
  schedule:
    - cron: "47 7-23 * * 1-5"    # hourly (at :47, to avoid GitHub's busy top of the hour) from the European morning to after the US close
  workflow_dispatch:              # lets you run it by hand: Actions tab, "Update market data", "Run workflow"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt nbconvert ipykernel

      - name: Build every dashboard
        run: |
          mkdir -p outputs /tmp/nb
          for u in global canada mega penny; do
            echo "::group::build $u"
            HL_UNIVERSE=$u jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=3000 --ExecutePreprocessor.kernel_name=python3 \
              --output-dir /tmp/nb --output "run_$u.ipynb" global_market_analysis.ipynb || echo "::warning::$u failed, keeping the last published data"
            echo "::endgroup::"
          done
          ls -la outputs

      - name: Make the website and the data files
        run: python publish_data.py --out pub --site --pin "${{ vars.PUBLIC_PIN || '1605' }}"

      - name: Publish to the data branch
        env:
          PUBLISH_REPO: ${{ vars.DATA_REPO || github.repository }}
          PUBLISH_TOKEN: ${{ secrets.DATA_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          cd pub
          git init -q -b data
          git config user.name "half-layer-bot"
          git config user.email "half-layer-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Website and data to $(date -u +%F) (single commit, replaced on every run)"
          git push --force "https://x-access-token:${PUBLISH_TOKEN}@github.com/${PUBLISH_REPO}.git" data
